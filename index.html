<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>와이앤지성장 | 정부지원사업</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    body {
      width: 100%;
    }

    #page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* =========================
       최상단 페이지 제목
    ========================= */

    #page-title {
      width: 100%;
      margin: 0 0 24px;
      padding: 0;
    }

    .page-title {
      margin: 0;
      padding: 0;

      color: #1b3c35;

      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;

      word-break: keep-all;
    }

    /* =========================
       노션 회사소개
    ========================= */

    #notion-intro {
      width: 100%;
      margin: 0 0 22px;
      padding: 0;
    }

    #notion-intro .block {
      margin: 0;
      padding: 0;
    }

    #notion-intro p {
      margin: 0;
      padding: 0;

      font-size: 16px;
      line-height: 1.6;
      letter-spacing: -0.15px;

      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
    }

    #notion-intro p:empty {
      height: 12px;
      min-height: 12px;
    }

    /* =========================
       홈페이지 미리보기
    ========================= */

    .homepage-preview {
      width: 100%;
      height: 460px;

      margin: 0 0 14px;
      padding: 0;

      overflow: hidden;

      border: 1px solid #e5e5e5;
      border-radius: 14px;

      background: #f7f7f7;
    }

    .homepage-preview iframe {
      display: block;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: 0;
    }

    /* =========================
       홈페이지 안내
    ========================= */

    .homepage-guide {
      margin: 0 0 38px;
      padding: 0;

      font-size: 16px;
      line-height: 1.6;
    }

    .homepage-guide p {
      margin: 0;
      padding: 0;
    }

    /* =========================
       로딩
    ========================= */

    #loading {
      margin: 0;
      padding: 35px 0;

      text-align: center;

      color: #777777;

      line-height: 1.6;
    }

    /* =========================
       실제 노션 공문
    ========================= */

    #content {
      width: 100%;

      margin: 0;
      padding: 0;
    }

    #content .block {
      width: 100%;

      margin: 0;
      padding: 0;
    }

    #content p {
      width: 100%;

      margin: 0;
      padding: 0;

      font-size: 16px;
      line-height: 1.6;
      letter-spacing: -0.15px;

      white-space: pre-wrap;

      word-break: normal;
      overflow-wrap: break-word;
    }

    #content p:empty {
      display: block;

      height: 14px;
      min-height: 14px;
    }

    #content h1 {
      margin: 26px 0 8px;
      padding: 0;

      color: #1b3c35;

      font-size: 26px;
      line-height: 1.4;

      word-break: keep-all;
    }

    #content h2 {
      margin: 22px 0 7px;
      padding: 0;

      color: #1b3c35;

      font-size: 21px;
      line-height: 1.45;

      word-break: keep-all;
    }

    #content h3 {
      margin: 18px 0 6px;
      padding: 0;

      color: #1b3c35;

      font-size: 18px;
      line-height: 1.45;

      word-break: keep-all;
    }

    /* =========================
       목록
    ========================= */

    .list-item {
      margin: 0;
      padding: 0;

      font-size: 16px;
      line-height: 1.6;

      white-space: pre-wrap;

      word-break: normal;
      overflow-wrap: break-word;
    }

    /* =========================
       체크박스
    ========================= */

    .todo {
      display: flex;

      align-items: flex-start;

      gap: 8px;

      margin: 0;
      padding: 0;

      line-height: 1.6;
    }

    .todo input {
      margin-top: 5px;
    }

    /* =========================
       인용
    ========================= */

    .quote {
      margin: 12px 0;

      padding: 4px 0 4px 14px;

      border-left: 4px solid #a4c539;

      color: #444444;

      line-height: 1.6;

      white-space: pre-wrap;
    }

    /* =========================
       콜아웃
    ========================= */

    .callout {
      margin: 12px 0;

      padding: 15px;

      background: #f5f7f5;

      border-radius: 10px;

      line-height: 1.6;

      white-space: pre-wrap;
    }

    /* =========================
       구분선
    ========================= */

    .divider {
      width: 100%;
      height: 1px;

      margin: 20px 0;

      background: #e7e7e7;
    }

    /* =========================
       코드
    ========================= */

    .code {
      overflow-x: auto;

      margin: 12px 0;

      padding: 15px;

      background: #f5f5f5;

      border-radius: 10px;

      font-family: monospace;

      line-height: 1.55;

      white-space: pre-wrap;
    }

    /* =========================
       이미지
    ========================= */

    .notion-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 16px 0 5px;

      border-radius: 10px;
    }

    .image-caption {
      margin: 0 0 12px;

      color: #777777;

      font-size: 13px;
      line-height: 1.5;

      text-align: center;
    }

    /* =========================
       링크
    ========================= */

    .link-card {
      display: block;

      width: 100%;

      margin: 10px 0;

      padding: 13px 15px;

      border: 1px solid #dddddd;
      border-radius: 9px;

      color: #1b3c35;

      text-decoration: none;

      word-break: break-all;
    }

    /* =========================
       표
    ========================= */

    .table-wrap {
      width: 100%;

      margin: 14px 0;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;

      min-width: 520px;

      border-collapse: collapse;

      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;

      border: 1px solid #dedede;

      text-align: left;
      vertical-align: top;

      line-height: 1.5;

      white-space: pre-wrap;
    }

    th {
      background: #f5f7f5;

      color: #1b3c35;

      font-weight: 700;
    }

    /* =========================
       하위 블록
    ========================= */

    details {
      margin: 8px 0;
    }

    summary {
      cursor: pointer;

      font-weight: 600;

      line-height: 1.55;
    }

    .children {
      margin: 0 0 0 18px;

      padding: 0 0 0 8px;
    }

    /* =========================
       인스타 이동
    ========================= */

    #instagram-end {
      display: none;

      margin-top: 45px;

      padding: 28px 18px;

      background: #f5f7f5;

      border-radius: 14px;

      text-align: center;
    }

    #instagram-end h2 {
      margin: 0 0 5px;

      padding: 0;

      color: #1b3c35;

      font-size: 20px;
      line-height: 1.4;
    }

    #instagram-end p {
      margin: 0;

      padding: 0;

      color: #555555;

      line-height: 1.5;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      #page {
        width: 100%;
        max-width: 100%;

        padding: 18px 18px 50px;
      }

      #page-title {
        margin-bottom: 20px;
      }

      .page-title {
        font-size: 25px;

        line-height: 1.35;
      }

      #notion-intro {
        margin-bottom: 20px;
      }

      #notion-intro p {
        font-size: 15px;

        line-height: 1.6;
      }

      .homepage-preview {
        width: 100%;

        height: 410px;
      }

      .homepage-guide {
        font-size: 15px;
      }

      #content p,
      .list-item {
        font-size: 15px;

        line-height: 1.6;
      }

      #content h1 {
        font-size: 22px;
      }

      #content h2 {
        font-size: 19px;
      }

      #content h3 {
        font-size: 17px;
      }

      .children {
        margin-left: 12px;

        padding-left: 6px;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 10px;
      }
    }

  </style>
</head>


<body>

  <main id="page">

    <!-- ① Notion 페이지 제목 -->
    <div id="page-title"></div>

    <!-- ② Notion 회사소개 -->
    <div id="notion-intro"></div>

    <!-- ③ 홈페이지 미리보기 -->
    <div class="homepage-preview">

      <iframe
        src="https://yng-homepage.vercel.app/grant"
        title="와이앤지성장 홈페이지"
        loading="eager">
      </iframe>

    </div>

    <!-- ④ 홈페이지 안내 -->
    <div class="homepage-guide">

      <p>↑ 와이앤지성장이 어떤 회사인지 궁금하시다면</p>
      <p>홈페이지에서 먼저 확인해보세요!</p>

    </div>

    <!-- ⑤ 로딩 -->
    <div id="loading">
      내용을 불러오는 중입니다...
    </div>

    <!-- ⑥ 실제 공문 -->
    <div id="content"></div>

    <!-- ⑦ 인스타 이동 -->
    <div id="instagram-end">

      <h2>
        마지막까지 읽어주셔서 감사합니다.
      </h2>

      <p>
        와이앤지성장 인스타그램으로 이동합니다 →
      </p>

    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );


    const pageValue =
      params.get("page");


    const pageTitle =
      document.getElementById(
        "page-title"
      );


    const notionIntro =
      document.getElementById(
        "notion-intro"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const content =
      document.getElementById(
        "content"
      );


    const instagramEnd =
      document.getElementById(
        "instagram-end"
      );


    /* =========================
       Notion 페이지 ID
    ========================= */

    function extractPageId(value) {

      if (!value) {
        return "";
      }


      let decoded =
        value;


      try {

        decoded =
          decodeURIComponent(
            value
          );

      } catch (error) {}


      const normalized =
        decoded.replace(
          /-/g,
          ""
        );


      const matches =
        normalized.match(
          /[a-f0-9]{32}/gi
        );


      if (
        !matches ||
        !matches.length
      ) {

        return "";

      }


      return matches[
        matches.length - 1
      ];

    }


    /* =========================
       텍스트 생성
    ========================= */

    function createTextElement(
      tag,
      text,
      className
    ) {

      const element =
        document.createElement(
          tag
        );


      if (className) {

        element.className =
          className;

      }


      element.textContent =
        text ?? "";


      return element;

    }


    /* =========================
       표
    ========================= */

    function renderTable(
      block
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "table-wrap";


      const table =
        document.createElement(
          "table"
        );


      const rows =
        block.rows || [];


      rows.forEach(
        (
          row,
          rowIndex
        ) => {

          const tr =
            document.createElement(
              "tr"
            );


          (
            row.cells ||
            []
          ).forEach(
            (
              cellText
            ) => {

              const useHeader =
                block.hasColumnHeader &&
                rowIndex === 0;


              const cell =
                document.createElement(
                  useHeader
                    ? "th"
                    : "td"
                );


              cell.textContent =
                cellText ?? "";


              tr.appendChild(
                cell
              );

            }
          );


          table.appendChild(
            tr
          );

        }
      );


      wrapper.appendChild(
        table
      );


      return wrapper;

    }


    /* =========================
       Notion 블록
    ========================= */

    function renderBlock(
      block
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "block";


      switch (
        block.type
      ) {


        case "paragraph":

          wrapper.appendChild(
            createTextElement(
              "p",
              block.text ?? ""
            )
          );

          break;


        case "heading_1":

          wrapper.appendChild(
            createTextElement(
              "h1",
              block.text
            )
          );

          break;


        case "heading_2":

          wrapper.appendChild(
            createTextElement(
              "h2",
              block.text
            )
          );

          break;


        case "heading_3":

          wrapper.appendChild(
            createTextElement(
              "h3",
              block.text
            )
          );

          break;


        case "bulleted_list_item":

          wrapper.appendChild(
            createTextElement(
              "div",
              "• " +
                (
                  block.text ??
                  ""
                ),
              "list-item"
            )
          );

          break;


        case "numbered_list_item":

          wrapper.appendChild(
            createTextElement(
              "div",
              block.text ?? "",
              "list-item"
            )
          );

          break;


        case "to_do": {

          const label =
            document.createElement(
              "label"
            );


          label.className =
            "todo";


          const checkbox =
            document.createElement(
              "input"
            );


          checkbox.type =
            "checkbox";


          checkbox.checked =
            Boolean(
              block.checked
            );


          checkbox.disabled =
            true;


          const text =
            document.createElement(
              "span"
            );


          text.textContent =
            block.text ?? "";


          label.appendChild(
            checkbox
          );


          label.appendChild(
            text
          );


          wrapper.appendChild(
            label
          );


          break;

        }


        case "quote":

          wrapper.appendChild(
            createTextElement(
              "div",
              block.text,
              "quote"
            )
          );

          break;


        case "callout": {

          const callout =
            document.createElement(
              "div"
            );


          callout.className =
            "callout";


          if (
            block.icon
          ) {

            const icon =
              document.createElement(
                "span"
              );


            icon.textContent =
              block.icon +
              " ";


            callout.appendChild(
              icon
            );

          }


          const text =
            document.createElement(
              "span"
            );


          text.textContent =
            block.text ??
            "";


          callout.appendChild(
            text
          );


          wrapper.appendChild(
            callout
          );


          break;

        }


        case "divider": {

          const divider =
            document.createElement(
              "div"
            );


          divider.className =
            "divider";


          wrapper.appendChild(
            divider
          );


          break;

        }


        case "code": {

          const code =
            document.createElement(
              "pre"
            );


          code.className =
            "code";


          code.textContent =
            block.text ??
            "";


          wrapper.appendChild(
            code
          );


          break;

        }


        case "image": {

          if (
            block.url
          ) {

            const image =
              document.createElement(
                "img"
              );


            image.className =
              "notion-image";


            image.src =
              block.url;


            image.alt =
              block.caption ??
              "";


            wrapper.appendChild(
              image
            );


            if (
              block.caption
            ) {

              wrapper.appendChild(
                createTextElement(
                  "div",
                  block.caption,
                  "image-caption"
                )
              );

            }

          }


          break;

        }


        case "bookmark":
        case "link_preview": {

          if (
            block.url
          ) {

            const link =
              document.createElement(
                "a"
              );


            link.className =
              "link-card";


            link.href =
              block.url;


            link.target =
              "_blank";


            link.rel =
              "noopener noreferrer";


            link.textContent =
              block.url;


            wrapper.appendChild(
              link
            );

          }


          break;

        }


        case "table":

          wrapper.appendChild(
            renderTable(
              block
            )
          );

          break;


        case "toggle": {

          const details =
            document.createElement(
              "details"
            );


          const summary =
            document.createElement(
              "summary"
            );


          summary.textContent =
            block.text ??
            "";


          details.appendChild(
            summary
          );


          if (
            block.children &&
            block.children.length
          ) {

            const children =
              document.createElement(
                "div"
              );


            children.className =
              "children";


            renderBlocks(
              block.children,
              children
            );


            details.appendChild(
              children
            );

          }


          wrapper.appendChild(
            details
          );


          return wrapper;

        }


        default:

          if (
            block.text
          ) {

            wrapper.appendChild(
              createTextElement(
                "p",
                block.text
              )
            );

          }

      }


      if (
        block.children &&
        block.children.length
      ) {

        const childContainer =
          document.createElement(
            "div"
          );


        childContainer.className =
          "children";


        renderBlocks(
          block.children,
          childContainer
        );


        wrapper.appendChild(
          childContainer
        );

      }


      return wrapper;

    }


    /* =========================
       여러 블록
    ========================= */

    function renderBlocks(
      blocks,
      parent
    ) {

      (
        blocks || []
      ).forEach(
        (
          block
        ) => {

          parent.appendChild(
            renderBlock(
              block
            )
          );

        }
      );

    }


    /* =========================
       인스타 자동 이동

       마지막 영역이
       10% 보이면
       0.3초 후 이동
    ========================= */

    function startInstagramRedirect() {

      let started =
        false;


      const goToInstagram =
        () => {

          if (
            started
          ) {

            return;

          }


          started =
            true;


          setTimeout(
            () => {

              window.location.href =
                "https://www.instagram.com/yng_biz/";

            },
            300
          );

        };


      const observer =
        new IntersectionObserver(

          (
            entries
          ) => {

            entries.forEach(
              (
                entry
              ) => {

                if (
                  entry.isIntersecting
                ) {

                  goToInstagram();

                }

              }
            );

          },

          {
            threshold: 0.1
          }

        );


      observer.observe(
        instagramEnd
      );

    }


    /* =========================
       Notion 로딩
    ========================= */

    async function loadPage() {

      const pageId =
        extractPageId(
          pageValue
        );


      if (
        !pageId
      ) {

        loading.innerHTML =
          "불러올 노션 페이지가 지정되지 않았습니다.";


        return;

      }


      try {

        const response =
          await fetch(
            "/api/notion?page=" +
              encodeURIComponent(
                pageId
              )
          );


        const data =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(
            data.details ||
              data.error ||
              "페이지를 불러오지 못했습니다."
          );

        }


        loading.style.display =
          "none";


        /* =====================
           제목 가장 위
        ===================== */

        if (
          data.title
        ) {

          const title =
            createTextElement(
              "h1",
              data.title,
              "page-title"
            );


          pageTitle.appendChild(
            title
          );

        }


        /* =====================
           노션 블록 분리

           첫 회사소개까지는
           홈페이지 위로

           나머지는 실제 공문
        ===================== */

        const allBlocks =
          data.blocks || [];


        const introBlocks =
          [];


        const bodyBlocks =
          [];


        let introFinished =
          false;


        allBlocks.forEach(
          (
            block
          ) => {

            const text =
              (
                block.text ||
                ""
              ).trim();


            if (
              !introFinished
            ) {

              introBlocks.push(
                block
              );


              if (
                text.includes(
                  "빠르게 확인하실 수 있도록 안내해드립니다."
                )
              ) {

                introFinished =
                  true;

              }

            } else {

              bodyBlocks.push(
                block
              );

            }

          }
        );


        /* 회사소개 위쪽 */

        renderBlocks(
          introBlocks,
          notionIntro
        );


        /* 나머지 실제 공문 */

        renderBlocks(
          bodyBlocks,
          content
        );


        /* 인스타 영역 */

        instagramEnd.style.display =
          "block";


        startInstagramRedirect();


      } catch (
        error
      ) {

        console.error(
          error
        );


        loading.innerHTML =
          "페이지를 불러오지 못했습니다.<br>" +
          "노션 연결 또는 페이지 권한을 확인해주세요.";

      }

    }


    loadPage();

  </script>

</body>
</html>
