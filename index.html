<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>와이앤지성장 | 정부지원사업</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 20px;
      line-height: 1.8;
      color: #222;
    }

    #instagram-end {
      margin-top: 80px;
      padding: 40px 20px;
      text-align: center;
      background: #f5f7f5;
      border-radius: 16px;
    }

    #instagram-end h2 {
      color: #1b3c35;
    }
  </style>
</head>

<body>

  <h1>📅 놓치면 안 되는 정부지원사업</h1>

  <p>
    와이앤지성장은 사업자분들이 놓치지 말아야 할
    정부지원사업을 빠르게 확인하실 수 있도록 안내해드립니다.
  </p>

  <br><br><br>

  <p>
    ※ 지금은 테스트 페이지입니다.<br>
    나중에 이 부분에 노션에 작성하신 내용을 넣으면 됩니다.
  </p>

  <br><br><br><br><br><br><br><br><br><br>

  <div id="instagram-end">
    <h2>마지막까지 읽어주셔서 감사합니다.</h2>
    <p>와이앤지성장 인스타그램으로 이동합니다 →</p>
  </div>

  <script>
    const target = document.getElementById("instagram-end");
    let redirectStarted = false;

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !redirectStarted) {
        redirectStarted = true;

        setTimeout(() => {
          window.location.href =
            "https://www.instagram.com/yng_biz/";
        }, 1500);
      }
    }, {
      threshold: 0.8
    });

    observer.observe(target);
  </script>

</body>
</html>
