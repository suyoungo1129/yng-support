<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>와이앤지성장 | 정부지원사업</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    #page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* =========================
       가장 위 Notion 페이지 제목
    ========================= */

    #page-title {
      width: 100%;
      margin: 0 0 26px;
      padding: 0;
    }

    .page-title {
      margin: 0;
      padding: 0;
      color: #1b3c35;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* =========================
       회사 소개
    ========================= */

    .company-intro {
      margin: 0 0 20px;
      padding: 0;
      font-size: 16px;
      line-height: 1.6;
    }

    .company-intro p {
      margin: 0;
      padding: 0;
    }

    .intro-space {
      height: 14px;
    }

    /* =========================
       홈페이지 미리보기
    ========================= */

    .homepage-preview {
      width: 100%;
      height: 460px;
      margin: 22px 0 14px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #f7f7f7;
    }

    .homepage-preview iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* =========================
       홈페이지 안내
    ========================= */

    .homepage-guide {
      margin: 0 0 38px;
      padding: 0;
      font-size: 16px;
      line-height: 1.6;
    }

    .homepage-guide p {
      margin: 0;
      padding: 0;
    }

    /* =========================
       로딩
    ========================= */

    #loading {
      padding: 35px 0;
      text-align: center;
      color: #777;
      line-height: 1.6;
    }

    /* =========================
       Notion 본문
    ========================= */

    #content {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #content .block {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #content p {
      width: 100%;
      margin: 0;
      padding: 0;
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: -0.15px;
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: break-word;
    }

    #content p:empty {
      display: block;
      height: 14px;
      min-height: 14px;
    }

    #content h1 {
      margin: 26px 0 8px;
      padding: 0;
      color: #1b3c35;
      font-size: 26px;
      line-height: 1.4;
      word-break: keep-all;
    }

    #content h2 {
      margin: 22px 0 7px;
      padding: 0;
      color: #1b3c35;
      font-size: 21px;
      line-height: 1.45;
      word-break: keep-all;
    }

    #content h3 {
      margin: 18px 0 6px;
      padding: 0;
      color: #1b3c35;
      font-size: 18px;
      line-height: 1.45;
      word-break: keep-all;
    }

    .list-item {
      margin: 0;
      padding: 0;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .todo {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .todo input {
      margin-top: 5px;
    }

    .quote {
      margin: 12px 0;
      padding: 4px 0 4px 14px;
      border-left: 4px solid #a4c539;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .callout {
      margin: 12px 0;
      padding: 15px;
      background: #f5f7f5;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .divider {
      height: 1px;
      margin: 20px 0;
      background: #e7e7e7;
    }

    .code {
      overflow-x: auto;
      margin: 12px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .notion-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 16px 0 5px;
      border-radius: 10px;
    }

    .image-caption {
      margin: 0 0 12px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    .link-card {
      display: block;
      margin: 10px 0;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 9px;
      color: #1b3c35;
      text-decoration: none;
      word-break: break-all;
    }

    .table-wrap {
      width: 100%;
      margin: 14px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #dedede;
      line-height: 1.5;
      text-align: left;
      vertical-align: top;
      white-space: pre-wrap;
    }

    th {
      background: #f5f7f5;
      color: #1b3c35;
      font-weight: 700;
    }

    details {
      margin: 8px 0;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      line-height: 1.55;
    }

    .children {
      margin-left: 18px;
      padding-left: 8px;
    }

    /* =========================
       인스타 자동 이동 영역
    ========================= */

    #instagram-end {
      display: none;
      margin-top: 45px;
      padding: 28px 18px;
      background: #f5f7f5;
      border-radius: 14px;
      text-align: center;
    }

    #instagram-end h2 {
      margin: 0 0 5px;
      color: #1b3c35;
      font-size: 20px;
    }

    #instagram-end p {
      margin: 0;
      color: #555;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      #page {
        width: 100%;
        max-width: 100%;
        padding: 18px 18px 50px;
      }

      #page-title {
        margin-bottom: 22px;
      }

      .page-title {
        font-size: 25px;
        line-height: 1.35;
      }

      .company-intro {
        font-size: 15px;
      }

      .homepage-preview {
        height: 410px;
        margin-top: 18px;
      }

      .homepage-guide {
        font-size: 15px;
      }

      #content p,
      .list-item {
        font-size: 15px;
        line-height: 1.6;
      }

      #content h1 {
        font-size: 22px;
      }

      #content h2 {
        font-size: 19px;
      }

      #content h3 {
        font-size: 17px;
      }

      .children {
        margin-left: 12px;
        padding-left: 6px;
      }

      table {
        font-size: 13px;
      }
    }

  </style>
</head>

<body>

  <main id="page">

    <!-- ① 제일 위 Notion 페이지 제목 -->
    <div id="page-title"></div>

    <!-- ② 회사 소개 -->
    <section class="company-intro">

      <p>👋 안녕하세요, 와이앤지성장입니다.</p>

      <div class="intro-space"></div>

      <p>정책자금 · 무상지원금 · 기업인증 · 지원사업 등</p>
      <p>1,350개 기업과 함께한 경험을 바탕으로</p>
      <p>사업자분들이 놓치지 말아야 할 정부지원사업을</p>
      <p>빠르게 확인하실 수 있도록 안내해드립니다.</p>

    </section>

    <!-- ③ 홈페이지 미리보기 -->
    <div class="homepage-preview">

      <iframe
        src="https://yng-homepage.vercel.app/grant"
        title="와이앤지성장 홈페이지"
        loading="eager">
      </iframe>

    </div>

    <!-- ④ 홈페이지 안내 -->
    <div class="homepage-guide">

      <p>↑ 와이앤지성장이 어떤 회사인지 궁금하시다면</p>
      <p>홈페이지에서 먼저 확인해보세요!</p>

    </div>

    <!-- ⑤ Notion 공문 -->
    <div id="loading">
      내용을 불러오는 중입니다...
    </div>

    <div id="content"></div>

    <!-- ⑥ 인스타 이동 -->
    <div id="instagram-end">

      <h2>마지막까지 읽어주셔서 감사합니다.</h2>

      <p>
        와이앤지성장 인스타그램으로 이동합니다 →
      </p>

    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(window.location.search);

    const pageValue =
      params.get("page");

    const pageTitle =
      document.getElementById("page-title");

    const loading =
      document.getElementById("loading");

    const content =
      document.getElementById("content");

    const instagramEnd =
      document.getElementById("instagram-end");


    function extractPageId(value) {

      if (!value) {
        return "";
      }

      let decoded = value;

      try {
        decoded = decodeURIComponent(value);
      } catch (error) {}

      const normalized =
        decoded.replace(/-/g, "");

      const matches =
        normalized.match(/[a-f0-9]{32}/gi);

      if (!matches || !matches.length) {
        return "";
      }

      return matches[matches.length - 1];
    }


    function createTextElement(
      tag,
      text,
      className
    ) {

      const element =
        document.createElement(tag);

      if (className) {
        element.className = className;
      }

      element.textContent =
        text ?? "";

      return element;
    }


    function renderTable(block) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "table-wrap";

      const table =
        document.createElement("table");

      const rows =
        block.rows || [];

      rows.forEach((row, rowIndex) => {

        const tr =
          document.createElement("tr");

        (row.cells || []).forEach((cellText) => {

          const useHeader =
            block.hasColumnHeader &&
            rowIndex === 0;

          const cell =
            document.createElement(
              useHeader ? "th" : "td"
            );

          cell.textContent =
            cellText ?? "";

          tr.appendChild(cell);
        });

        table.appendChild(tr);
      });

      wrapper.appendChild(table);

      return wrapper;
    }


    function renderBlock(block) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "block";

      switch (block.type) {

        case "paragraph":
          wrapper.appendChild(
            createTextElement(
              "p",
              block.text ?? ""
            )
          );
          break;

        case "heading_1":
          wrapper.appendChild(
            createTextElement(
              "h1",
              block.text
            )
          );
          break;

        case "heading_2":
          wrapper.appendChild(
            createTextElement(
              "h2",
              block.text
            )
          );
          break;

        case "heading_3":
          wrapper.appendChild(
            createTextElement(
              "h3",
              block.text
            )
          );
          break;

        case "bulleted_list_item":
          wrapper.appendChild(
            createTextElement(
              "div",
              "• " + (block.text ?? ""),
              "list-item"
            )
          );
          break;

        case "numbered_list_item":
          wrapper.appendChild(
            createTextElement(
              "div",
              block.text ?? "",
              "list-item"
            )
          );
          break;

        case "to_do": {

          const label =
            document.createElement("label");

          label.className = "todo";

          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";
          checkbox.checked =
            Boolean(block.checked);
          checkbox.disabled = true;

          const text =
            document.createElement("span");

          text.textContent =
            block.text ?? "";

          label.appendChild(checkbox);
          label.appendChild(text);
          wrapper.appendChild(label);

          break;
        }

        case "quote":
          wrapper.appendChild(
            createTextElement(
              "div",
              block.text,
              "quote"
            )
          );
          break;

        case "callout": {

          const callout =
            document.createElement("div");

          callout.className = "callout";

          if (block.icon) {

            const icon =
              document.createElement("span");

            icon.textContent =
              block.icon + " ";

            callout.appendChild(icon);
          }

          const text =
            document.createElement("span");

          text.textContent =
            block.text ?? "";

          callout.appendChild(text);
          wrapper.appendChild(callout);

          break;
        }

        case "divider": {

          const divider =
            document.createElement("div");

          divider.className = "divider";

          wrapper.appendChild(divider);

          break;
        }

        case "code": {

          const code =
            document.createElement("pre");

          code.className = "code";

          code.textContent =
            block.text ?? "";

          wrapper.appendChild(code);

          break;
        }

        case "image": {

          if (block.url) {

            const image =
              document.createElement("img");

            image.className =
              "notion-image";

            image.src = block.url;

            image.alt =
              block.caption ?? "";

            wrapper.appendChild(image);

            if (block.caption) {

              wrapper.appendChild(
                createTextElement(
                  "div",
                  block.caption,
                  "image-caption"
                )
              );
            }
          }

          break;
        }

        case "bookmark":
        case "link_preview": {

          if (block.url) {

            const link =
              document.createElement("a");

            link.className =
              "link-card";

            link.href =
              block.url;

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

            link.textContent =
              block.url;

            wrapper.appendChild(link);
          }

          break;
        }

        case "table":
          wrapper.appendChild(
            renderTable(block)
          );
          break;

        case "toggle": {

          const details =
            document.createElement("details");

          const summary =
            document.createElement("summary");

          summary.textContent =
            block.text ?? "";

          details.appendChild(summary);

          if (
            block.children &&
            block.children.length
          ) {

            const children =
              document.createElement("div");

            children.className =
              "children";

            renderBlocks(
              block.children,
              children
            );

            details.appendChild(children);
          }

          wrapper.appendChild(details);

          return wrapper;
        }

        default:

          if (block.text) {

            wrapper.appendChild(
              createTextElement(
                "p",
                block.text
              )
            );
          }
      }

      if (
        block.children &&
        block.children.length
      ) {

        const childContainer =
          document.createElement("div");

        childContainer.className =
          "children";

        renderBlocks(
          block.children,
          childContainer
        );

        wrapper.appendChild(
          childContainer
        );
      }

      return wrapper;
    }


    function renderBlocks(
      blocks,
      parent
    ) {

      (blocks || []).forEach((block) => {

        parent.appendChild(
          renderBlock(block)
        );

      });
    }


    /* =========================
       인스타 자동 이동
       마지막 영역 10% 노출
       → 0.3초 후 이동
    ========================= */

    function startInstagramRedirect() {

      let started = false;

      const goToInstagram = () => {

        if (started) {
          return;
        }

        started = true;

        setTimeout(() => {

          window.location.href =
            "https://www.instagram.com/yng_biz/";

        }, 300);
      };


      const observer =
        new IntersectionObserver(

          (entries) => {

            entries.forEach((entry) => {

              if (entry.isIntersecting) {
                goToInstagram();
              }

            });
          },

          {
            threshold: 0.1
          }
        );

      observer.observe(
        instagramEnd
      );
    }


    async function loadPage() {

      const pageId =
        extractPageId(pageValue);

      if (!pageId) {

        loading.innerHTML =
          "불러올 노션 페이지가 지정되지 않았습니다.";

        return;
      }

      try {

        const response =
          await fetch(
            "/api/notion?page=" +
            encodeURIComponent(pageId)
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.details ||
            data.error ||
            "페이지를 불러오지 못했습니다."
          );
        }

        loading.style.display =
          "none";


        /* 핵심:
           Notion 페이지 제목을
           가장 위 영역에 표시 */

        if (data.title) {

          const title =
            createTextElement(
              "h1",
              data.title,
              "page-title"
            );

          pageTitle.appendChild(title);
        }


        /* 실제 Notion 공문 */

        renderBlocks(
          data.blocks || [],
          content
        );


        /* 마지막 이동 영역 */

        instagramEnd.style.display =
          "block";

        startInstagramRedirect();


      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "페이지를 불러오지 못했습니다.<br>" +
          "노션 연결 또는 페이지 권한을 확인해주세요.";
      }
    }


    loadPage();

  </script>

</body>
</html>
