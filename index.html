<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>와이앤지성장 | 정부지원사업</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #222;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    #page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 35px 20px 80px;
    }

    #loading {
      text-align: center;
      padding: 80px 20px;
      color: #777;
      line-height: 1.8;
    }

    .page-title {
      margin: 0 0 40px;
      color: #1b3c35;
      font-size: 30px;
      line-height: 1.45;
    }

    h1 {
      margin: 38px 0 16px;
      color: #1b3c35;
      font-size: 27px;
      line-height: 1.45;
    }

    h2 {
      margin: 34px 0 14px;
      color: #1b3c35;
      font-size: 22px;
      line-height: 1.5;
    }

    h3 {
      margin: 28px 0 12px;
      color: #1b3c35;
      font-size: 18px;
      line-height: 1.5;
    }

    p {
      margin: 10px 0;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .block {
      margin: 10px 0;
    }

    .list-item {
      margin: 7px 0;
      padding-left: 4px;
      line-height: 1.75;
    }

    .todo {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 8px 0;
      line-height: 1.7;
    }

    .todo input {
      margin-top: 6px;
    }

    .quote {
      margin: 20px 0;
      padding: 5px 0 5px 18px;
      border-left: 4px solid #a4c539;
      color: #444;
      line-height: 1.8;
    }

    .callout {
      margin: 18px 0;
      padding: 18px;
      background: #f5f7f5;
      border-radius: 12px;
      line-height: 1.8;
    }

    .callout-icon {
      margin-right: 8px;
    }

    .divider {
      height: 1px;
      background: #e7e7e7;
      margin: 32px 0;
    }

    .code {
      overflow-x: auto;
      padding: 18px;
      background: #f5f5f5;
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .notion-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 22px 0 8px;
      border-radius: 12px;
    }

    .image-caption {
      margin-bottom: 20px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    .link-card {
      display: block;
      margin: 14px 0;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      color: #1b3c35;
      text-decoration: none;
      word-break: break-all;
    }

    .table-wrap {
      width: 100%;
      margin: 20px 0;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 12px 13px;
      border: 1px solid #dedede;
      line-height: 1.6;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f7f5;
      color: #1b3c35;
      font-weight: 700;
    }

    details {
      margin: 12px 0;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      line-height: 1.7;
    }

    .children {
      margin-left: 20px;
      padding-left: 10px;
    }

    #instagram-end {
      display: none;
      margin-top: 100px;
      padding: 45px 20px;
      background: #f5f7f5;
      border-radius: 16px;
      text-align: center;
    }

    #instagram-end h2 {
      margin: 0 0 10px;
      color: #1b3c35;
    }

    #instagram-end p {
      margin: 0;
      color: #555;
    }

    @media (max-width: 600px) {
      #page {
        padding: 25px 17px 70px;
      }

      .page-title {
        font-size: 26px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main id="page">

    <div id="loading">
      내용을 불러오는 중입니다...
    </div>

    <div id="content"></div>

    <div id="instagram-end">
      <h2>마지막까지 읽어주셔서 감사합니다.</h2>
      <p>
        와이앤지성장 인스타그램으로 이동합니다 →
      </p>
    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(window.location.search);

    const pageValue =
      params.get("page");

    const loading =
      document.getElementById("loading");

    const content =
      document.getElementById("content");

    const instagramEnd =
      document.getElementById("instagram-end");


    function extractPageId(value) {

      if (!value) {
        return "";
      }

      let decoded = value;

      try {
        decoded = decodeURIComponent(value);
      } catch (e) {}

      const normalized =
        decoded.replace(/-/g, "");

      const matches =
        normalized.match(/[a-f0-9]{32}/gi);

      if (!matches || !matches.length) {
        return "";
      }

      return matches[matches.length - 1];
    }


    function createTextElement(
      tag,
      text,
      className
    ) {

      const el =
        document.createElement(tag);

      if (className) {
        el.className = className;
      }

      el.textContent =
        text || "";

      return el;
    }


    function renderTable(block) {

      const wrap =
        document.createElement("div");

      wrap.className =
        "table-wrap";

      const table =
        document.createElement("table");

      const rows =
        block.rows || [];

      rows.forEach((row, rowIndex) => {

        const tr =
          document.createElement("tr");

        (row.cells || []).forEach(
          (cellText) => {

            const useHeader =
              block.hasColumnHeader &&
              rowIndex === 0;

            const cell =
              document.createElement(
                useHeader ? "th" : "td"
              );

            cell.textContent =
              cellText || "";

            tr.appendChild(cell);
          }
        );

        table.appendChild(tr);
      });

      wrap.appendChild(table);

      return wrap;
    }


    function renderBlock(block) {

      const wrapper =
        document.createElement("div");

      wrapper.className = "block";

      switch (block.type) {

        case "paragraph":

          wrapper.appendChild(
            createTextElement(
              "p",
              block.text
            )
          );

          break;


        case "heading_1":

          wrapper.appendChild(
            createTextElement(
              "h1",
              block.text
            )
          );

          break;


        case "heading_2":

          wrapper.appendChild(
            createTextElement(
              "h2",
              block.text
            )
          );

          break;


        case "heading_3":

          wrapper.appendChild(
            createTextElement(
              "h3",
              block.text
            )
          );

          break;


        case "bulleted_list_item": {

          const item =
            createTextElement(
              "div",
              "• " + (block.text || ""),
              "list-item"
            );

          wrapper.appendChild(item);

          break;
        }


        case "numbered_list_item": {

          const item =
            createTextElement(
              "div",
              "• " + (block.text || ""),
              "list-item"
            );

          wrapper.appendChild(item);

          break;
        }


        case "to_do": {

          const label =
            document.createElement("label");

          label.className = "todo";

          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";
          checkbox.checked =
            Boolean(block.checked);

          checkbox.disabled = true;

          const text =
            document.createElement("span");

          text.textContent =
            block.text || "";

          label.appendChild(checkbox);
          label.appendChild(text);

          wrapper.appendChild(label);

          break;
        }


        case "quote": {

          const quote =
            createTextElement(
              "div",
              block.text,
              "quote"
            );

          wrapper.appendChild(quote);

          break;
        }


        case "callout": {

          const callout =
            document.createElement("div");

          callout.className =
            "callout";

          if (block.icon) {

            const icon =
              document.createElement("span");

            icon.className =
              "callout-icon";

            icon.textContent =
              block.icon;

            callout.appendChild(icon);
          }

          const text =
            document.createElement("span");

          text.textContent =
            block.text || "";

          callout.appendChild(text);

          wrapper.appendChild(callout);

          break;
        }


        case "divider": {

          const divider =
            document.createElement("div");

          divider.className =
            "divider";

          wrapper.appendChild(divider);

          break;
        }


        case "code": {

          const code =
            document.createElement("pre");

          code.className =
            "code";

          code.textContent =
            block.text || "";

          wrapper.appendChild(code);

          break;
        }


        case "image": {

          if (block.url) {

            const image =
              document.createElement("img");

            image.className =
              "notion-image";

            image.src =
              block.url;

            image.alt =
              block.caption || "";

            wrapper.appendChild(image);

            if (block.caption) {

              const caption =
                createTextElement(
                  "div",
                  block.caption,
                  "image-caption"
                );

              wrapper.appendChild(
                caption
              );
            }
          }

          break;
        }


        case "bookmark":
        case "link_preview": {

          if (block.url) {

            const link =
              document.createElement("a");

            link.className =
              "link-card";

            link.href =
              block.url;

            link.target =
              "_blank";

            link.rel =
              "noopener noreferrer";

            link.textContent =
              block.url;

            wrapper.appendChild(link);
          }

          break;
        }


        case "table":

          wrapper.appendChild(
            renderTable(block)
          );

          break;


        case "toggle": {

          const details =
            document.createElement(
              "details"
            );

          const summary =
            document.createElement(
              "summary"
            );

          summary.textContent =
            block.text || "";

          details.appendChild(summary);

          if (block.children?.length) {

            const childContainer =
              document.createElement("div");

            childContainer.className =
              "children";

            renderBlocks(
              block.children,
              childContainer
            );

            details.appendChild(
              childContainer
            );
          }

          wrapper.appendChild(details);

          return wrapper;
        }


        default:

          if (block.text) {

            wrapper.appendChild(
              createTextElement(
                "p",
                block.text
              )
            );
          }
      }


      if (
        block.children &&
        block.children.length
      ) {

        const childContainer =
          document.createElement("div");

        childContainer.className =
          "children";

        renderBlocks(
          block.children,
          childContainer
        );

        wrapper.appendChild(
          childContainer
        );
      }


      return wrapper;
    }


    function renderBlocks(
      blocks,
      parent
    ) {

      (blocks || []).forEach(
        (block) => {

          parent.appendChild(
            renderBlock(block)
          );

        }
      );
    }


    function startInstagramRedirect() {

      let started = false;

      const observer =
        new IntersectionObserver(
          (entries) => {

            if (
              entries[0].isIntersecting &&
              !started
            ) {

              started = true;

              setTimeout(() => {

                window.location.href =
                  "https://www.instagram.com/yng_biz/";

              }, 1500);
            }
          },
          {
            threshold: 0.8
          }
        );

      observer.observe(
        instagramEnd
      );
    }


    async function loadPage() {

      const pageId =
        extractPageId(pageValue);

      if (!pageId) {

        loading.innerHTML =
          "불러올 노션 페이지가 지정되지 않았습니다.";

        return;
      }


      try {

        const response =
          await fetch(
            "/api/notion?page=" +
            encodeURIComponent(pageId)
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.details ||
            data.error ||
            "페이지를 불러오지 못했습니다."
          );
        }


        loading.style.display =
          "none";


        if (data.title) {

          const title =
            createTextElement(
              "h1",
              data.title,
              "page-title"
            );

          content.appendChild(
            title
          );
        }


        renderBlocks(
          data.blocks || [],
          content
        );


        instagramEnd.style.display =
          "block";


        startInstagramRedirect();


      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "페이지를 불러오지 못했습니다.<br>" +
          "노션 연결 또는 페이지 권한을 확인해주세요.";

      }
    }


    loadPage();

  </script>

</body>
</html>
